<title>Certificação Imagem & Mídia</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --ink:#16171B; --paper:#F7F5F1; --surface:#FFFFFF; --surface-2:#EDEAE2;
  --accent:#A8672A; --accent-ink:#FFFFFF; --line:#E1DCD0;
  --muted:#6E6A60; --good:#3F7A52; --bad:#B23B3B; --star:#B8862E; --shadow:0 14px 30px -20px rgba(22,23,27,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ECE8DD; --paper:#16171B; --surface:#1D2027; --surface-2:#242832;
    --accent:#D9955C; --accent-ink:#16171B; --line:#2E323C;
    --muted:#9C9686; --good:#7ED18F; --bad:#F0918C; --star:#E3B563; --shadow:0 14px 30px -20px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ink:#ECE8DD; --paper:#16171B; --surface:#1D2027; --surface-2:#242832;
  --accent:#D9955C; --accent-ink:#16171B; --line:#2E323C;
  --muted:#9C9686; --good:#7ED18F; --bad:#F0918C; --shadow:0 14px 30px -20px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"Familjen Grotesk",system-ui,sans-serif;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
img{max-width:100%}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.narrow{max-width:640px;margin:0 auto;padding:0 24px}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:3px;padding:16px 30px;font-weight:600;font-size:1rem;transition:transform .15s ease, box-shadow .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn-primary:hover{box-shadow:0 22px 46px -20px rgba(201,122,46,.45)}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-block{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:600;color:var(--accent)}
.muted{color:var(--muted)}
input,select{width:100%;font:inherit;padding:14px 16px;border-radius:3px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{font-size:.85rem;font-weight:600;display:block;margin-bottom:6px}
.field{margin-bottom:16px}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--paper) 90%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:"Familjen Grotesk",sans-serif;font-weight:700;font-size:1.15rem}
.brand-logo{height:38px;width:auto;display:block}
.progress{height:3px;background:var(--line);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:6px 14px;font-size:.85rem;font-weight:500}
.course-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px;cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease}
.course-card:hover,.course-card:focus-visible{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.course-num{color:var(--accent);font-weight:700;font-size:.75rem}
.course-name{font-family:"Familjen Grotesk",sans-serif;font-weight:600;font-size:1.1rem}
.course-meta{color:var(--muted);font-size:.82rem}
.urgency-banner{text-align:center;margin-bottom:20px}
.urgency-eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.78rem;font-weight:700;color:var(--bad);margin-bottom:10px}
.urgency-badge{display:inline-block;background:var(--bad);color:#fff;font-weight:700;font-size:.9rem;padding:10px 22px;border-radius:3px}
.bonus-box{border:1px solid var(--line);border-radius:4px;padding:18px 20px;margin-bottom:20px;background:var(--surface-2)}
.bonus-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.bonus-item + .bonus-item{border-top:1px solid var(--line)}
.bonus-name{font-weight:600}
.bonus-price s{color:var(--muted);margin-right:8px}
.bonus-price strong{color:var(--good)}
.review-grid{display:grid;gap:16px}
@media(min-width:720px){.review-grid{grid-template-columns:repeat(3,1fr)}}
.review-card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:20px}
.review-stars{color:var(--star);letter-spacing:2px;font-size:.95rem;margin-bottom:10px}
.review-quote{font-size:.92rem;margin:0 0 12px}
.review-attribution{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted)}
.review-example-tag{font-size:.68rem;opacity:.75}
.grid{display:grid;gap:16px}
@media(min-width:720px){.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(3,1fr)}}
.section{padding:72px 0}
.hr{border:none;border-top:1px solid var(--line);margin:28px 0}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:3px;cursor:pointer;transition:border-color .15s, background .15s}
.opt:hover{border-color:var(--accent)}
.opt.selected{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, var(--surface))}
.opt input{width:auto}
.badge-good{background:color-mix(in srgb, var(--good) 18%, var(--surface));color:var(--good);border-radius:3px;padding:4px 12px;font-weight:600;font-size:.8rem}
.badge-bad{background:color-mix(in srgb, var(--bad) 18%, var(--surface));color:var(--bad);border-radius:3px;padding:4px 12px;font-weight:600;font-size:.8rem}
.cert-canvas{width:100%;height:auto;display:block;border-radius:2px;box-shadow:var(--shadow)}
.cert-preview-wrap{position:relative;max-width:480px;margin:28px auto 0;border-radius:2px;overflow:hidden;box-shadow:var(--shadow)}
.cert-preview-img{display:block;width:100%;height:auto}
.cert-blur{position:absolute;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);background:rgba(255,255,255,.1)}
.cert-lock-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq p{margin:10px 0 0;color:var(--muted)}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.total-row{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.2rem;border-top:1.5px solid var(--line);padding-top:14px;margin-top:8px}
.bump{border:2px solid var(--accent);border-radius:4px;padding:20px;background:color-mix(in srgb, var(--accent) 9%, var(--surface));box-shadow:var(--shadow)}
.bump-badge{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:5px 12px;border-radius:3px;margin-bottom:12px}
.bump .opt span{font-size:1.02rem}
.pill-steps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.pill-steps span{font-size:.75rem;padding:5px 12px;border-radius:3px;border:1px solid var(--line);color:var(--muted);font-family:"IBM Plex Mono",monospace}
.pill-steps span.active{border-color:var(--accent);color:var(--accent);font-weight:600}
footer{padding:40px 0;text-align:center;color:var(--muted);font-size:.85rem}
</style>

function loadState(){ try{ const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); return s || defaultState(); }catch(e){ return defaultState(); } }
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
let state = loadState();
function profById(id){ return CONFIG.professions.find(p=>p.id===id); }
function go(hash){ location.hash = hash; }
function code(str){ let h=0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; } return h.toString(16).toUpperCase().padStart(8,'0'); }

  { name: 'Apostila digital completa (PDF)', price: 49.90 },
  { name: 'Matrícula', price: 24.78 },
];
const REVIEWS = [
  { quote: 'Fiz a prova numa tarde e já baixei meu certificado. Coloquei no Instagram na hora.', name: 'Julia S. Oliveira' },

  { quote: 'Rápido, direto ao ponto, e o certificado ficou muito bonito.', name: 'Hebert P. Lima' },
];
function urgencyBannerHTML(){
  return `<div class="urgency-banner">
    <div class="urgency-eyebrow">Somente até fechar essa turma</div>
    <span class="urgency-badge">Somente mais 12 vagas</span>
  </div>`;
}

  return `<div class="bonus-box">
    <div class="eyebrow" style="margin-bottom:10px">Bônus inclusos</div>
    ${BONUS_ITEMS.map(b=>`<div class="bonus-item"><span class="bonus-name">${b.name}</span><span class="bonus-price"><s>${fmt(b.price)}</s> <strong>Grátis</strong></span></div>`).join('')}
  </div>`;
}
function reviewsSectionHTML(){
  return `<div>
    <div class="eyebrow" style="text-align:center;margin-bottom:14px;display:block">Avaliações</div>
    <div class="review-grid">
      ${REVIEWS.map(r=>`
      <div class="review-card">

        <div class="review-attribution"><span>${r.name}</span></div>
      </div>`).join('')}
    </div>
  </div>`;
}
function certPreviewHTML(){
  return `<div class="cert-preview-wrap">
    <img class="cert-preview-img" src="${CERT_IMAGE}" alt="Prévia do certificado">
    <div class="cert-blur" style="top:39%;height:11%;left:12%;width:76%"></div>
    <div class="cert-blur" style="top:59%;height:8%;left:12%;width:76%"></div>

  <button class="btn btn-primary btn-block" data-action="go" data-hash="form" style="max-width:480px;margin:16px auto 0">Desbloqueie seu certificado já →</button>`;
}

function topbar(activeStep){
  return `<div class="topbar"><div class="topbar-inner">
    <img class="brand-logo" src="${LOGO_IMAGE}" alt="${CONFIG.brand}">
    ${activeStep ? `<div class="chip mono">Ambiente seguro</div>` : `<div class="chip">${CONFIG.groupLabel}</div>`}
  </div></div>`;
}
function stepPills(activeStep){
  const steps = [['form','1. Dados'],['checkout','2. Pagamento'],['quiz','3. Prova'],['result','4. Certificado']];
  return `<div class="pill-steps">${steps.map(([k,l])=>`<span class="${k===activeStep?'active':''}">${l}</span>`).join('')}</div>`;
}

function render(){
  let hash = location.hash.slice(1) || 'home';
  if(hash.startsWith('pago-')){
    const tier = hash.slice(5);
    state.tier = tier;
    state.certs = tier==='base' ? [state.mainId] : [state.mainId, state.secondId].filter(Boolean);
    state.quiz = {certIdx:0,qIdx:0,answers:{},results:{},attempts:{}};
    saveState();
    go('quiz');
    return;
  }
  if(hash==='form') renderForm();
  else if(hash==='checkout') renderCheckout();
  else if(hash==='downsell') renderDownsell();
  else if(hash==='return') renderReturn();
  else if(hash==='quiz') renderQuiz();
  else if(hash==='result') renderResult();
  else renderHome();
  window.scrollTo(0,0);
  bindActions();
}

      <div style="text-align:center;margin-bottom:32px">
        <div class="eyebrow">Escolha o seu</div>
        <h2 class="display" style="font-size:1.8rem;margin-top:8px">Certificados disponíveis</h2>
        <p class="muted" style="margin-top:8px">Clique em uma especialidade para começar. Você pode adicionar o segundo certificado depois, no checkout.</p>
      </div>
      <div class="grid grid-2" style="max-width:640px;margin:0 auto">
        ${CONFIG.professions.map((p,i)=>`
        <button class="course-card" type="button" data-action="pick" data-id="${p.id}">
          <span class="mono course-num">${String(i+1).padStart(2,'0')}</span>
          <span class="course-name">${p.label}</span>
          <span class="course-meta">Prova de 10 perguntas · certificado digital</span>
        </button>`).join('')}
      </div>

  </section>

  <section class="section" style="padding-top:0">
    <div class="narrow faq">
      <h2 class="display" style="font-size:1.6rem;margin-bottom:8px">Perguntas frequentes</h2>
      <details><summary>O certificado tem validade legal? <span>+</span></summary><p>É um certificado digital de proficiência profissional, que atesta seu conhecimento técnico na área. Ele é amplamente aceito como comprovação de qualificação para currículo, portfólio e redes sociais.</p></details>
      <details><summary>E se eu não passar na prova? <span>+</span></summary><p>Sem problema: você pode refazer a prova até mais 2 vezes (3 tentativas no total), sem custo adicional, até atingir os 70% de acerto.</p></details>
      <details><summary>Como eu recebo meu certificado? <span>+</span></summary><p>Assim que você acerta pelo menos 7 das 10 perguntas, o certificado é gerado automaticamente e liberado para download na hora.</p></details>
      <details><summary>O pagamento é seguro? <span>+</span></summary><p>Sim. Todo o pagamento é processado pelo Mercado Pago, uma das maiores plataformas de pagamento do Brasil.</p></details>
    </div>
  </section>

  <section class="section" style="padding-top:0">

      <button class="btn btn-primary" data-action="go" data-hash="form">Quero meu certificado agora →</button>
    </div>
  </section>
  <footer>© ${new Date().getFullYear()} ${CONFIG.brand} · Certificação de ${CONFIG.groupLabel} · <a href="/privacidade" style="color:inherit">Privacidade e Termos</a></footer>
  `;
}

function renderForm(){
  const opts = CONFIG.professions.map(p=>`<option value="${p.id}" ${state.mainId===p.id?'selected':''}>${p.label}</option>`).join('');
  app.innerHTML = `
  ${topbar('form')}
  <section class="section" style="padding-top:44px">
    <div class="narrow">
      ${stepPills('form')}
      <div class="card" style="padding:32px">
        <h2 class="display" style="font-size:1.5rem;margin:0 0 4px">Seus dados</h2>
        <p class="muted" style="margin:0 0 24px;font-size:.92rem">Preencha para gerar seu certificado corretamente.</p>
        <form id="lead-form">
          <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" required value="${state.lead.nome}" placeholder="Como deve aparecer no certificado"></div>
          <div class="field"><label for="telefone">WhatsApp</label><input id="telefone" name="telefone" required value="${state.lead.telefone}" placeholder="(00) 00000-0000"></div>
          <div class="field"><label for="email">E-mail</label><input id="email" type="email" name="email" required value="${state.lead.email}" placeholder="voce@email.com"></div>
          <div class="field"><label for="profissao">Qual certificado você quer?</label><select id="profissao" name="profissao" required>${opts}</select></div>
          <button class="btn btn-primary btn-block" type="submit">Continuar para pagamento →</button>
        </form>
      </div>
    </div>
  </section>`;
  document.getElementById('lead-form').addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    state.lead = { nome:f.get('nome').trim(), telefone:f.get('telefone').trim(), email:f.get('email').trim() };
    state.mainId = f.get('profissao');
    saveState();
    if(LEAD_WEBHOOK_URL){
      fetch(LEAD_WEBHOOK_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...state.lead, profissao: state.mainId, grupo: CONFIG.slug, data: new Date().toISOString()}) }).catch(()=>{});
    }
    go('checkout');
  });
}

function renderCheckout(){
  const main = profById(state.mainId);
  const others = CONFIG.professions.filter(p=>p.id!==state.mainId);
  const total = CONFIG.price.base + (ui.bumpChecked ? CONFIG.price.bumpAdd : 0);
  app.innerHTML = `
  ${topbar('checkout')}
  <section class="section" style="padding-top:44px">
    <div class="narrow">
      ${stepPills('checkout')}
      <div class="card" style="padding:32px">
        <h2 class="display" style="font-size:1.5rem;margin:0 0 18px">Finalizar pedido</h2>
        ${urgencyBannerHTML()}
        ${bonusSectionHTML()}
        <div class="price-row"><span>Certificado de ${main.label}</span><span class="mono">${fmt(CONFIG.price.base)}</span></div>
        <div class="hr"></div>
        <div class="bump">
          <div class="bump-badge">Oferta mais escolhida</div>
          <label class="opt ${ui.bumpChecked?'selected':''}" style="border:none;padding:0;cursor:pointer">
            <input type="checkbox" id="bump-check" ${ui.bumpChecked?'checked':''}>
            <span><strong>Material Secreto para se tornar um Expert</strong> + o 2º certificado (${others.map(p=>p.label).join(', ')}) — por apenas +${fmt(CONFIG.price.bumpAdd)}</span>
          </label>
          ${ui.bumpChecked ? `
          <div class="field" style="margin-top:14px">
            <label for="second-prof">Segundo certificado</label>
            <select id="second-prof">${others.map(p=>`<option value="${p.id}" ${ui.secondId===p.id?'selected':''}>${p.label}</option>`).join('')}</select>
          </div>` : ''}
        </div>
        <div class="total-row"><span>Total</span><span class="mono">${fmt(total)}</span></div>
        <div style="margin-top:24px">${reviewsSectionHTML()}</div>
        <button class="btn btn-primary btn-block" id="finalize-btn" style="margin-top:22px">Finalizar compra — Pagamento seguro via Mercado Pago</button>
        <p class="muted" style="text-align:center;font-size:.78rem;margin-top:10px">Você será redirecionado ao ambiente oficial do Mercado Pago para concluir o pagamento.</p>
      </div>
    </div>
  </section>`;
  const bc = document.getElementById('bump-check');
  bc.addEventListener('change', e=>{ ui.bumpChecked = e.target.checked; if(ui.bumpChecked && !ui.secondId){ ui.secondId = others[0].id; } render(); });
  const sp = document.getElementById('second-prof');
  if(sp) sp.addEventListener('change', e=>{ ui.secondId = e.target.value; });
  document.getElementById('finalize-btn').addEventListener('click', ()=>{
    if(ui.bumpChecked){
      if(!ui.secondId){ alert('Selecione o segundo certificado.'); return; }
      state.secondId = ui.secondId; state.tier = 'bump'; state.certs = [state.mainId, state.secondId];
      saveState();
      window.open(CONFIG.links.bump, '_blank');
      go('return');
    } else {
      go('downsell');
    }
  });
}

function renderDownsell(){
  const main = profById(state.mainId);
  const others = CONFIG.professions.filter(p=>p.id!==state.mainId);
  if(!ui.downsellSecondId) ui.downsellSecondId = others[0].id;
  app.innerHTML = `
  ${topbar('checkout')}
  <section class="section" style="padding-top:44px">
    <div class="narrow">
      <div class="card" style="padding:32px;border-color:var(--accent)">
        <div class="eyebrow">Espera, oferta única</div>
        <h2 class="display" style="font-size:1.4rem;margin:8px 0 14px">Antes de continuar — adicione o 2º certificado por só ${fmt(CONFIG.price.downsellAdd)}</h2>
        <p class="muted" style="margin:0 0 18px">Sem material em PDF, só o certificado extra. Essa oferta some quando você sair desta tela.</p>
        <div class="field">
          <label for="downsell-prof">Segundo certificado</label>
          <select id="downsell-prof">${others.map(p=>`<option value="${p.id}" ${ui.downsellSecondId===p.id?'selected':''}>${p.label}</option>`).join('')}</select>
        </div>
        <div class="total-row"><span>Total com 2 certificados</span><span class="mono">${fmt(CONFIG.price.base + CONFIG.price.downsellAdd)}</span></div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
          <button class="btn btn-primary btn-block" id="downsell-yes">Sim, adicionar por +${fmt(CONFIG.price.downsellAdd)}</button>
          <button class="btn btn-ghost btn-block" id="downsell-no">Não, quero só o certificado de ${main.label}</button>
        </div>
      </div>
    </div>
  </section>`;
  document.getElementById('downsell-prof').addEventListener('change', e=>{ ui.downsellSecondId = e.target.value; });
  document.getElementById('downsell-yes').addEventListener('click', ()=>{
    state.secondId = ui.downsellSecondId; state.tier = 'downsell'; state.certs = [state.mainId, state.secondId];
    saveState();
    window.open(CONFIG.links.downsell, '_blank');
    go('return');
  });
  document.getElementById('downsell-no').addEventListener('click', ()=>{
    state.tier = 'base'; state.certs = [state.mainId];
    saveState();
    window.open(CONFIG.links.base, '_blank');
    go('return');
  });
}

function renderReturn(){
  const link = state.tier==='bump' ? CONFIG.links.bump : state.tier==='downsell' ? CONFIG.links.downsell : CONFIG.links.base;
  app.innerHTML = `
  ${topbar('checkout')}
  <section class="section" style="padding-top:60px">
    <div class="narrow" style="text-align:center">
      <div class="card" style="padding:36px">
        <div class="eyebrow">Pagamento</div>
        <h2 class="display" style="font-size:1.4rem;margin:14px 0 10px">Finalize o pagamento no Mercado Pago</h2>
        <p class="muted">Abrimos o Mercado Pago em outra aba. Depois de concluir o pagamento, volte para cá e clique no botão abaixo para começar sua prova.</p>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:22px">
          <a class="btn btn-ghost btn-block" href="${link}" target="_blank" rel="noopener">Não abriu? Clique aqui para pagar</a>
          <button class="btn btn-primary btn-block" id="paid-btn">Já paguei, continuar para a prova →</button>
        </div>
      </div>
    </div>
  </section>`;
  document.getElementById('paid-btn').addEventListener('click', ()=>{
    state.quiz = {certIdx:0,qIdx:0,answers:{},results:{},attempts:{}};
    saveState();
    go('quiz');
  });
}

function renderQuiz(){
  const certs = state.certs.length ? state.certs : [state.mainId];
  if(state.quiz.certIdx >= certs.length){ go('result'); return; }
  const certId = certs[state.quiz.certIdx];
  const prof = profById(certId);
  const qList = prof.quiz;
  const qIdx = state.quiz.qIdx;
  const question = qList[qIdx];
  const answers = state.quiz.answers[certId] || [];
  const selected = answers[qIdx];
  app.innerHTML = `
  ${topbar('quiz')}
  <section class="section" style="padding-top:44px">
    <div class="narrow">
      ${stepPills('quiz')}
      ${certs.length>1 ? `<div class="chip" style="margin-bottom:14px">Certificado ${state.quiz.certIdx+1} de ${certs.length}: ${prof.label}</div>` : ''}
      <div class="card" style="padding:32px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span class="mono muted" style="font-size:.8rem">Pergunta ${qIdx+1} de ${qList.length}</span>
          <span class="mono muted" style="font-size:.8rem">Mínimo para passar: 7/10</span>
        </div>
        <div class="progress" style="margin-bottom:22px"><i style="width:${((qIdx)/qList.length*100)}%"></i></div>
        <h3 style="font-size:1.15rem;margin:0 0 18px">${question.q}</h3>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${question.o.map((opt,i)=>`
          <label class="opt ${selected===i?'selected':''}" data-idx="${i}">
            <input type="radio" name="quiz-opt" ${selected===i?'checked':''}>
            <span>${opt}</span>
          </label>`).join('')}
        </div>
        <button class="btn btn-primary btn-block" id="next-btn" style="margin-top:24px" ${selected===undefined?'disabled':''}>${qIdx===qList.length-1 ? 'Finalizar esta prova' : 'Próxima pergunta →'}</button>
      </div>
    </div>
  </section>`;
  app.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = parseInt(el.dataset.idx,10);
      if(!state.quiz.answers[certId]) state.quiz.answers[certId] = [];
      state.quiz.answers[certId][qIdx] = i;
      saveState();
      renderQuiz();
    });
  });
  const nb = document.getElementById('next-btn');
  if(nb) nb.addEventListener('click', ()=>{
    if(state.quiz.answers[certId]===undefined || state.quiz.answers[certId][qIdx]===undefined) return;
    if(qIdx < qList.length-1){
      state.quiz.qIdx = qIdx+1;
      saveState();
      renderQuiz();
    } else {
      const ans = state.quiz.answers[certId] || [];
      let score = 0;
      qList.forEach((q,i)=>{ if(ans[i]===q.c) score++; });
      state.quiz.results[certId] = { score, passed: score>=7 };
      if(!state.quiz.attempts) state.quiz.attempts = {};
      state.quiz.attempts[certId] = (state.quiz.attempts[certId]||0) + 1;
      state.quiz.certIdx += 1;
      state.quiz.qIdx = 0;
      saveState();
      render_go_next_or_result();
    }
  });
}
function render_go_next_or_result(){
  const certs = state.certs.length ? state.certs : [state.mainId];
  if(state.quiz.certIdx >= certs.length){ go('result'); } else { renderQuiz(); }
}

function renderResult(){
  const certs = state.certs.length ? state.certs : [state.mainId];
  const blocks = certs.map(certId=>{
    const prof = profById(certId);
    const res = state.quiz.results[certId];
    if(!res) return '';
    if(res.passed){
      const vcode = CONFIG.slug.slice(0,3).toUpperCase() + '-' + code(state.lead.nome + certId + new Date().toDateString());
      return `
      <div class="card" style="padding:28px;margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h3 style="margin:0;font-size:1.1rem">${prof.cert}</h3>
          <span class="badge-good">Aprovado — ${res.score}/10</span>
        </div>
        <canvas class="cert-canvas" id="cert-${certId}"></canvas>
        <p class="muted mono" style="text-align:center;font-size:.72rem;margin-top:10px">Código de verificação ${vcode}</p>
        <button class="btn btn-primary btn-block" style="margin-top:14px" data-download="${certId}">Baixar certificado</button>
      </div>`;
    }
    const attemptsUsed = (state.quiz.attempts && state.quiz.attempts[certId]) || 0;
    const attemptsLeft = Math.max(0, MAX_ATTEMPTS - attemptsUsed);
    return `
      <div class="card" style="padding:28px;margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h3 style="margin:0;font-size:1.1rem">${prof.cert}</h3>
          <span class="badge-bad">${res.score}/10 — não atingiu 70%</span>
        </div>
        ${attemptsLeft > 0 ? `
        <p class="muted">Quase lá! São necessários pelo menos 7 acertos em 10 para liberar o certificado. Você ainda pode tentar mais ${attemptsLeft} ${attemptsLeft===1?'vez':'vezes'}, sem custo.</p>
        <button class="btn btn-ghost btn-block" data-retry="${certId}">Tentar novamente</button>
        ` : `
        <p class="muted">Você usou suas ${MAX_ATTEMPTS} tentativas para este certificado e não atingiu os 70% necessários.</p>
        `}
      </div>`;
  }).join('');
  app.innerHTML = `
  ${topbar('result')}
  <section class="section" style="padding-top:44px">
    <div class="narrow">
      ${stepPills('result')}
      ${blocks}
      <p class="muted" style="text-align:center;font-size:.85rem">Guarde este link — seus certificados ficam salvos neste navegador.</p>
    </div>
  </section>
  <footer>© ${new Date().getFullYear()} ${CONFIG.brand} · Certificação de ${CONFIG.groupLabel} · <a href="/privacidade" style="color:inherit">Privacidade e Termos</a></footer>
  `;
  app.querySelectorAll('[data-retry]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const certId = btn.dataset.retry;
      const idx = certs.indexOf(certId);
      delete state.quiz.results[certId];
      state.quiz.answers[certId] = [];
      state.quiz.certIdx = idx;
      state.quiz.qIdx = 0;
      saveState();
      go('quiz');
    });
  });
  certs.forEach(certId=>{
    const res = state.quiz.results[certId];
    if(res && res.passed) drawCertificate(certId);
  });
  app.querySelectorAll('[data-download]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const certId = btn.dataset.download;
      const canvas = document.getElementById('cert-'+certId);
      if(!canvas || !canvas.width) return;
      btn.disabled = true; btn.textContent = 'Gerando...';
      canvas.toBlob(async (blob)=>{
        try{
          const downloads = window.claude ? await window.claude.use('downloads') : null;
          if(downloads){
            await downloads.save({ filename:`certificado-${CONFIG.slug}-${certId}.jpg`, data: blob });
            btn.textContent = 'Certificado salvo';
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `certificado-${CONFIG.slug}-${certId}.jpg`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(()=>URL.revokeObjectURL(url), 4000);
            btn.textContent = 'Certificado salvo';
          }
        }catch(err){
          btn.textContent = 'Baixar certificado';
          btn.disabled = false;
        }
      }, 'image/jpeg', 0.92);
    });
  });
}

async function drawCertificate(certId){
  const prof = profById(certId);
  const canvas = document.getElementById('cert-'+certId);
  if(!canvas) return;
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  const img = new Image();
  img.onload = ()=>{
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const W = canvas.width, H = canvas.height;
    const dateStr = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#16223A';
    ctx.font = `italic 600 ${Math.round(H*0.062)}px "Cormorant Garamond", Georgia, serif`;
    ctx.fillText(state.lead.nome || 'Seu Nome Aqui', W*0.5, H*0.470);
    ctx.font = `600 ${Math.round(H*0.038)}px "Cormorant Garamond", Georgia, serif`;
    ctx.fillText((prof.cert || '').toUpperCase(), W*0.5, H*0.636);
    ctx.font = `500 ${Math.round(H*0.032)}px "Cormorant Garamond", Georgia, serif`;
    ctx.fillText(dateStr, W*0.5, H*0.763);
  };
  img.src = CERT_IMAGE;
}

function bindActions(){
  app.querySelectorAll('[data-action="go"]').forEach(el=>{
    el.addEventListener('click', ()=> go(el.dataset.hash));
  });
  app.querySelectorAll('[data-action="pick"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.mainId = el.dataset.id;
      saveState();
      go('form');
    });
  });
}

window.addEventListener('hashchange', render);
document.addEventListener('DOMContentLoaded', render);
render();
</script>
