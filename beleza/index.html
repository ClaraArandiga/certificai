function loadState(){ try{ const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); return s || defaultState(); }catch(e){ return defaultState(); } }

function go(hash){ location.hash = hash; }
function code(str){ let h=0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; } return h.toString(16).toUpperCase().padStart(8,'0'); }

function stepPills(activeStep){
  const steps = [['form','1. Dados'],['checkout','2. Pagamento'],['quiz','3. Prova'],['result','4. Certificado']];

}

function render(){
  let hash = location.hash.slice(1) || 'home';
  if(hash==='form') renderForm();
  else if(hash==='checkout') renderCheckout();
  else if(hash==='downsell') renderDownsell();
  else if(hash==='return') renderReturn();
  else if(hash==='quiz') renderQuiz();
  else if(hash==='result') renderResult();
  else renderHome();
  window.scrollTo(0,0);
  bindActions();
}

async function checkPaymentReturn(){
  const params = new URLSearchParams(location.search);
  const paymentId = params.get('payment_id');
  if(!paymentId) return false;
  renderVerifying();
  try{
    const res = await fetch(`/api/verify-payment?payment_id=${encodeURIComponent(paymentId)}&slug=${encodeURIComponent(CONFIG.slug)}`);
    const data = await res.json();
    if(data.ok){
      const tier = data.external_reference.slice(CONFIG.slug.length+1);
      applyVerifiedTier(tier);
      history.replaceState(null, '', location.pathname);
      go('quiz');
    } else {
      renderVerifyFailed();
    }
  }catch(err){
    renderVerifyFailed();
  }
  return true;
}

function renderQuiz(){
  const certs = state.certs.length ? state.certs : [state.mainId];
  if(state.quiz.certIdx >= certs.length){ go('result'); return; }
  const certId = certs[state.quiz.certIdx];
  const prof = profById(certId);
  const qList = prof.quiz;
  const qIdx = state.quiz.qIdx;
  const question = qList[qIdx];
  const answers = state.quiz.answers[certId] || [];
  const selected = answers[qIdx];
  app.innerHTML = `
  ${topbar('quiz')}
  <section class="section" style="padding-top:44px">
    <div class="narrow">
      ${stepPills('quiz')}
      ${certs.length>1 ? `<div class="chip" style="margin-bottom:14px">Certificado ${state.quiz.certIdx+1} de ${certs.length}: ${prof.label}</div>` : ''}
      <div class="card" style="padding:32px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span class="mono muted" style="font-size:.8rem">Pergunta ${qIdx+1} de ${qList.length}</span>
          <span class="mono muted" style="font-size:.8rem">Mínimo para passar: 7/10</span>
        </div>
        <div class="progress" style="margin-bottom:22px"><i style="width:${((qIdx)/qList.length*100)}%"></i></div>
        <h3 style="font-size:1.15rem;margin:0 0 18px">${question.q}</h3>
        <div style="display:flex;flex-direction:column;gap:10px">
          ${question.o.map((opt,i)=>`
          <label class="opt ${selected===i?'selected':''}" data-idx="${i}">
            <input type="radio" name="quiz-opt" ${selected===i?'checked':''}>
            <span>${opt}</span>
          </label>`).join('')}
        </div>
        <button class="btn btn-primary btn-block" id="next-btn" style="margin-top:24px" ${selected===undefined?'disabled':''}>${qIdx===qList.length-1 ? 'Finalizar esta prova' : 'Próxima pergunta →'}</button>
      </div>
    </div>
  </section>`;
  app.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = parseInt(el.dataset.idx,10);
      if(!state.quiz.answers[certId]) state.quiz.answers[certId] = [];
      state.quiz.answers[certId][qIdx] = i;
      saveState();
      renderQuiz();
    });
  });
  const nb = document.getElementById('next-btn');
  if(nb) nb.addEventListener('click', ()=>{
    if(state.quiz.answers[certId]===undefined || state.quiz.answers[certId][qIdx]===undefined) return;
    if(qIdx < qList.length-1){
      state.quiz.qIdx = qIdx+1;
      saveState();
      renderQuiz();
    } else {
      const ans = state.quiz.answers[certId] || [];
      let score = 0;
      qList.forEach((q,i)=>{ if(ans[i]===q.c) score++; });
      state.quiz.results[certId] = { score, passed: score>=7 };
      if(!state.quiz.attempts) state.quiz.attempts = {};
      state.quiz.attempts[certId] = (state.quiz.attempts[certId]||0) + 1;
      state.quiz.certIdx += 1;
      state.quiz.qIdx = 0;
      saveState();
      render_go_next_or_result();
    }
  });
}
function render_go_next_or_result(){
  const certs = state.certs.length ? state.certs : [state.mainId];
  if(state.quiz.certIdx >= certs.length){ go('result'); } else { renderQuiz(); }
}

function renderResult(){
  const certs = state.certs.length ? state.certs : [state.mainId];
  const blocks = certs.map(certId=>{
    const prof = profById(certId);
    const res = state.quiz.results[certId];
    if(!res) return '';
    if(res.passed){
      const vcode = CONFIG.slug.slice(0,3).toUpperCase() + '-' + code(state.lead.nome + certId + new Date().toDateString());
      return `
      <div class="card" style="padding:28px;margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h3 style="margin:0;font-size:1.1rem">${prof.cert}</h3>
          <span class="badge-good">Aprovado — ${res.score}/10</span>
        </div>
        <canvas class="cert-canvas" id="cert-${certId}"></canvas>
        <p class="muted mono" style="text-align:center;font-size:.72rem;margin-top:10px">Código de verificação ${vcode}</p>
        <button class="btn btn-primary btn-block" style="margin-top:14px" data-download="${certId}">Baixar certificado</button>
      </div>`;
    }
    const attemptsUsed = (state.quiz.attempts && state.quiz.attempts[certId]) || 0;
    const attemptsLeft = Math.max(0, MAX_ATTEMPTS - attemptsUsed);
    return `
      <div class="card" style="padding:28px;margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <h3 style="margin:0;font-size:1.1rem">${prof.cert}</h3>
          <span class="badge-bad">${res.score}/10 — não atingiu 70%</span>
        </div>
        ${attemptsLeft > 0 ? `
        <p class="muted">Quase lá! São necessários pelo menos 7 acertos em 10 para liberar o certificado. Você ainda pode tentar mais ${attemptsLeft} ${attemptsLeft===1?'vez':'vezes'}, sem custo.</p>
        <button class="btn btn-ghost btn-block" data-retry="${certId}">Tentar novamente</button>
        ` : `
        <p class="muted">Você usou suas ${MAX_ATTEMPTS} tentativas para este certificado e não atingiu os 70% necessários.</p>
        `}
      </div>`;
  }).join('');
  app.innerHTML = `
  ${topbar('result')}
  <section class="section" style="padding-top:44px">
    <div class="narrow">
      ${stepPills('result')}
      ${blocks}
      <p class="muted" style="text-align:center;font-size:.85rem">Guarde este link — seus certificados ficam salvos neste navegador.</p>
    </div>
  </section>
  <footer>© ${new Date().getFullYear()} ${CONFIG.brand} · Certificação de ${CONFIG.groupLabel} · <a href="/privacidade" style="color:inherit">Privacidade e Termos</a></footer>
  `;
  app.querySelectorAll('[data-retry]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const certId = btn.dataset.retry;
      const idx = certs.indexOf(certId);
      delete state.quiz.results[certId];
      state.quiz.answers[certId] = [];
      state.quiz.certIdx = idx;
      state.quiz.qIdx = 0;
      saveState();
      go('quiz');
    });
  });
  certs.forEach(certId=>{
    const res = state.quiz.results[certId];
    if(res && res.passed) drawCertificate(certId);
  });
  app.querySelectorAll('[data-download]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const certId = btn.dataset.download;
      const canvas = document.getElementById('cert-'+certId);
      if(!canvas || !canvas.width) return;
      btn.disabled = true; btn.textContent = 'Gerando...';
      canvas.toBlob(async (blob)=>{
        try{
          const downloads = window.claude ? await window.claude.use('downloads') : null;
          if(downloads){
            await downloads.save({ filename:`certificado-${CONFIG.slug}-${certId}.jpg`, data: blob });
            btn.textContent = 'Certificado salvo';
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `certificado-${CONFIG.slug}-${certId}.jpg`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(()=>URL.revokeObjectURL(url), 4000);
            btn.textContent = 'Certificado salvo';
          }
        }catch(err){
          btn.textContent = 'Baixar certificado';
          btn.disabled = false;
        }
      }, 'image/jpeg', 0.92);
    });
  });
}

async function drawCertificate(certId){
  const prof = profById(certId);
  const canvas = document.getElementById('cert-'+certId);
  if(!canvas) return;
  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  const img = new Image();
  img.onload = ()=>{
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const W = canvas.width, H = canvas.height;
    const dateStr = new Date().toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#16223A';
    ctx.font = `italic 600 ${Math.round(H*0.062)}px "Cormorant Garamond", Georgia, serif`;
    ctx.fillText(state.lead.nome || 'Seu Nome Aqui', W*0.5, H*0.470);
    ctx.font = `600 ${Math.round(H*0.038)}px "Cormorant Garamond", Georgia, serif`;
    ctx.fillText((prof.cert || '').toUpperCase(), W*0.5, H*0.636);
    ctx.font = `500 ${Math.round(H*0.032)}px "Cormorant Garamond", Georgia, serif`;
    ctx.fillText(dateStr, W*0.5, H*0.763);
  };
  img.src = CERT_IMAGE;
}

    el.addEventListener('click', ()=> go(el.dataset.hash));
  });
  app.querySelectorAll('[data-action="pick"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.mainId = el.dataset.id;
      saveState();
      go('form');
    });
  });
}

window.addEventListener('hashchange', render);
async function init(){
  const handled = await checkPaymentReturn();
  if(!handled) render();
}
document.addEventListener('DOMContentLoaded', init);
init();
</script>
